name: Run Tests
on:
  workflow_run:
    workflows:
      - Bundle and Deploy
    types:
      - completed
  schedule:
    - cron: "0 * * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          # Full history is required to diff the PR against its base branch
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Detect changed extensions
        id: changed
        # Only relevant on pull requests; other triggers always run the full suite
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # List every file changed by the PR (three dots = diff from the merge base)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")

          # If the PR touches anything outside src/<extension>/, run the full suite
          if echo "$CHANGED_FILES" | grep -qvE '^src/[^/]+/'; then
