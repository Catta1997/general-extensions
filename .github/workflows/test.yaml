name: Run Extension Tests
on:
  workflow_run:
    workflows:
      - Bundle and Deploy
    types:
      - completed
  schedule:
    - cron: "0 * * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Extension Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
        with:
          # On PRs this is the merge commit; depth 2 includes both parents,
          # which is enough to diff the PR against its base
          fetch-depth: 2

      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Extension Tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)

            # Only extension folders changed: test just those, one at a time
            # (the CLI accepts a single extension per run)
            if ! echo "$CHANGED" | grep -qvE '^src/[^/]+/'; then
              STATUS=0
              for EXT in $(echo "$CHANGED" | cut -d/ -f2 | sort -u); do
                # Skip extensions deleted by the PR
                [ -d "src/$EXT" ] || continue

                echo "::group::Testing $EXT"
                npm test -- "$EXT" || STATUS=1
                echo "::endgroup::"
              done
              exit $STATUS
            fi
          fi

          # Every other trigger, or PRs touching shared code: full suite
          npm test

      - name: Upload Test Results
        # Test results are only uploaded outside of pull requests
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: tests.json
          path: bundles/tests.json
